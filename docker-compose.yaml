services:
  # 1. Local AI execution engine (Ollama on CPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_storage:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    # Copy to /tmp first to avoid locking the host-mounted file inode
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /entrypoint.sh > /tmp/entrypoint.sh && chmod +x /tmp/entrypoint.sh && /tmp/entrypoint.sh"]
    restart: unless-stopped

  # 2. Go / FastAPI Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - PYTHONPATH=/app
      - TORCHDYNAMO_DISABLE=1
      - TORCH_LOGS=-all
      - PYTHONWARNINGS=ignore
      - TORCHDYNAMO_CAPTURE_SCALAR_OUTPUTS=1
    depends_on:
      - ollama
    restart: unless-stopped

  # 3. Next.js Web Frontend UI
  frontend_ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - INTERNAL_BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_storage: